[package]
name = "yt-tldr"
version = "0.1.0"
edition = "2024"
publish = false
description = "Telegram bot: a YouTube link in, progress and key takeaways out"

[dependencies]
anyhow = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
sha2 = "0.11"
httpdate = "1"
