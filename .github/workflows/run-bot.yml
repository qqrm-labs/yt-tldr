name: Run Bot

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Check deployment or configure the dedicated YouTube bot
        type: choice
        required: true
        default: check
        options:
          - check
          - setup
      youtube_url:
        description: Public YouTube URL to check without Telegram (result is public)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: run-bot
  cancel-in-progress: false

jobs:
  deployment-check:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && (inputs.youtube_url != '' || inputs.operation == 'check' || inputs.operation == 'setup')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build bot
        run: cargo build --release --locked

      - name: Check bot readiness
        if: inputs.youtube_url == ''
        env:
          ALLOWED_CHAT_IDS: ${{ secrets.ALLOWED_CHAT_IDS }}
          YT_TELEGRAM_BOT_TOKEN: ${{ secrets.YT_TELEGRAM_BOT_TOKEN }}
          EXPECTED_TELEGRAM_BOT_USERNAME: ${{ vars.EXPECTED_TELEGRAM_BOT_USERNAME }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
        shell: bash
        run: |
          set -euo pipefail
          ./target/release/yt-tldr doctor | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Configure bot commands
        if: inputs.operation == 'setup' && inputs.youtube_url == ''
        env:
          YT_TELEGRAM_BOT_TOKEN: ${{ secrets.YT_TELEGRAM_BOT_TOKEN }}
          EXPECTED_TELEGRAM_BOT_USERNAME: ${{ vars.EXPECTED_TELEGRAM_BOT_USERNAME }}
        run: ./target/release/yt-tldr setup

      - name: Process public test video
        if: inputs.youtube_url != ''
        env:
          TEST_URL: ${{ inputs.youtube_url }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
        shell: bash
        run: |
          set -euo pipefail
          printf '## Public video check\n\nCommit: %s\n\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          # Generated text belongs in the summary, not the runner command stream.
          ./target/release/yt-tldr process "$TEST_URL" >> "$GITHUB_STEP_SUMMARY"
