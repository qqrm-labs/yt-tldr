name: Run Bot

on:
  schedule:
    # Каждые 5 минут: вычерпать очередь getUpdates. Первая реакция на ссылку — 0-10 минут.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      youtube_url:
        description: Process this YouTube video instead of polling Telegram (test)
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: run-bot
  cancel-in-progress: false

jobs:
  run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable

      - name: Cache build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Restore persistent state
        id: restore-state
        shell: bash
        run: |
          set -euo pipefail
          # A transport/authentication failure must never mean an absent branch.
          remote_ref=$(git ls-remote --heads origin refs/heads/bot-state)
          if [[ -z "$remote_ref" ]]; then
            echo "No bot-state branch yet; confirmed initial bootstrap."
            echo "head=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ok=0
          for attempt in 1 2 3; do
            if git fetch origin bot-state:refs/remotes/origin/bot-state 2>/dev/null; then
              ok=1
              break
            fi
            echo "fetch attempt $attempt failed; retrying in 10s" >&2
            sleep 10
          done
          if [[ "$ok" == "1" ]]; then
            echo "head=$(git rev-parse origin/bot-state)" >> "$GITHUB_OUTPUT"
            mkdir -p data
            git archive origin/bot-state data | tar -x
          else
            echo "bot-state exists but could not be fetched; refusing empty dedup state" >&2
            exit 1
          fi

      - name: Restore authoritative delivery checkpoint
        id: restore-delivery
        env:
          GH_TOKEN: ${{ github.token }}
          DELIVERY_STATE_KEY: yt-tldr.json
          ARCHIVE_HEAD: ${{ steps.restore-state.outputs.head }}
        shell: bash
        run: |
          set -euo pipefail
          status=0
          python3 .github/scripts/remote_state.py restore data/bot-state.json || status=$?
          if [[ "$status" == 3 ]]; then
            if [[ ! -f data/bot-state.json ]]; then
              test -z "$ARCHIVE_HEAD" || { echo "Existing archive has no state; refusing empty delivery memory" >&2; exit 1; }
              mkdir -p data
              printf '{}\n' > data/bot-state.json
            fi
            python3 .github/scripts/remote_state.py save data/bot-state.json
          elif [[ "$status" != 0 ]]; then
            exit "$status"
          fi

      - name: Build bot
        run: cargo build --release --locked

      - name: Process test video
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.youtube_url != '' }}
        env:
          TEST_URL: ${{ inputs.youtube_url }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
        shell: bash
        run: |
          set -euo pipefail
          ./target/release/yt-tldr process "$TEST_URL" | tee "$GITHUB_STEP_SUMMARY"

      - name: Poll Telegram
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.youtube_url != '') }}
        env:
          DELIVERY_CHECKPOINT: .github/scripts/remote_state.py
          DELIVERY_STATE_KEY: yt-tldr.json
          GH_TOKEN: ${{ github.token }}
          ALLOWED_CHAT_IDS: ${{ secrets.ALLOWED_CHAT_IDS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
        shell: bash
        run: ./target/release/yt-tldr poll

      - name: Save state
        if: always() && steps.restore-state.outcome == 'success' && steps.restore-delivery.outcome == 'success'
        env:
          RESTORED_STATE_HEAD: ${{ steps.restore-state.outputs.head }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d data ]]; then
            echo "No data directory; state was not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          state_dir="$RUNNER_TEMP/yt-tldr-state"
          remote_ref=$(git ls-remote --heads origin refs/heads/bot-state)
          remote_head=${remote_ref%%$'\t'*}
          if [[ "$remote_head" != "$RESTORED_STATE_HEAD" ]]; then
            echo "bot-state changed during this run; refusing to overwrite newer state" >&2
            exit 1
          fi
          if [[ -n "$remote_head" ]]; then
            git fetch origin bot-state:refs/remotes/origin/bot-state
            test "$(git rev-parse origin/bot-state)" = "$RESTORED_STATE_HEAD"
            git worktree add "$state_dir" origin/bot-state
          else
            git worktree add --detach "$state_dir" HEAD
            git -C "$state_dir" checkout --orphan bot-state
            git -C "$state_dir" rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p "$state_dir/data"
          cp -a data/. "$state_dir/data/"
          git -C "$state_dir" add data
          if ! git -C "$state_dir" diff --cached --quiet; then
            git -C "$state_dir" commit -m "Update bot state"
            git -C "$state_dir" push origin HEAD:bot-state
          fi
