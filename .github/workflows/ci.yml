name: CI

on:
  pull_request:
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --locked --tests

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Install dependency audit
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      - name: Audit dependencies
        run: cargo audit --deny unsound

  ci-gate:
    if: always()
    needs: [checks]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every CI job to succeed
        env:
          RESULT_0: ${{ needs.checks.result }}
        run: |
          test "$RESULT_0" = success
